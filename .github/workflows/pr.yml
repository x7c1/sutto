name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint and format check
        run: npm run check:strict

      - name: Build
        run: |
          cp .envrc.example .envrc
          npm run build

      - name: Run tests
        run: npm run test:run

  # Aggregates every job's result. This is the required check in the default branch's ruleset.
  # When adding a job, add it to needs as well.
  all-green:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
