name: Validate Release PR

# Checks the release PR's title and summary. Other PRs pass. See
# docs/guides/08-release-workflow.md.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    permissions:
      contents: read
    uses: x7c1/colophon/.github/workflows/validate-release-pr.yml@f8431bbc0604ad67234d5f04033eb488283dfa2f # v0.1.1
    with:
      version-scheme: semver
