name: Validate Release PR

# Checks the release PR's title and summary. Other PRs pass. See
# docs/guides/08-release-workflow.md.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate:
    permissions:
      contents: read
    uses: x7c1/colophon/.github/workflows/validate-release-pr.yml@32c12d334eab2aad2e21df7008df099e4bf2c665 # v0.2.0
    with:
      version-scheme: semver
