name: Release

# Once CI passes on the merge of a release PR, builds the extension zip at
# that commit and publishes it as a GitHub Release through colophon. See
# docs/guides/08-release-workflow.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  plan:
    permissions:
      contents: read
      pull-requests: read
    uses: x7c1/colophon/.github/workflows/release-plan.yml@f8431bbc0604ad67234d5f04033eb488283dfa2f # v0.1.1
    with:
      version-scheme: semver

  build:
    needs: plan
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Extension
        run: npm run build:release
        env:
          LICENSE_API_BASE_URL: ${{ secrets.LICENSE_API_BASE_URL }}
          LICENSE_PURCHASE_URL: ${{ secrets.LICENSE_PURCHASE_URL }}

      - name: Package Extension
        id: package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: ./scripts/package-extension.sh "$(jq -r '.uuid' dist/metadata.json)" "$VERSION"

      - name: Upload the extension zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: ${{ steps.package.outputs.filename }}
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.released == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: x7c1/colophon/.github/workflows/release-publish.yml@f8431bbc0604ad67234d5f04033eb488283dfa2f # v0.1.1
    with:
      tag: ${{ needs.plan.outputs.tag }}
      sha: ${{ needs.plan.outputs.sha }}
      pr-number: ${{ needs.plan.outputs.pr-number }}
      artifact-name: extension
