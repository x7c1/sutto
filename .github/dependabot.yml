# Weekly update pull requests, on Monday morning (Asia/Tokyo).
#
# Minor and patch updates of each ecosystem arrive as one grouped pull
# request, since they rarely break anything and one CI run covers them all.
# Major updates stay one pull request each, so a failing one points at the
# dependency that broke. Security updates are not grouped.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    # The @girs type packages stay on the line that describes the targeted
    # GNOME Shell, and move to the next line only in the change that adds
    # support for that Shell (docs/guides/05-typescript-build.md, "Where types
    # come from"). Minor and patch updates still arrive in the group above.
    ignore:
      - dependency-name: "@girs/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
